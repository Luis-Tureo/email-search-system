<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ingreso UAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- CSS institucional -->
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>

  <div class="container-fluid d-flex justify-content-center">
    <div class="w-100" style="max-width:1100px;">

      <!-- HEADER -->
      <div class="header-bar">
        <div>
          <h1 class="title-main">Ingreso UAP</h1>
          <div class="subtitle-main">
            Registro de Denuncias y Medidas de Protección
          </div>
        </div>
        <button class="btn btn-logout">Cerrar sesión</button>
      </div>

      <!-- SELECCIÓN TIPO -->
      <section id="procedure-selection" class="my-5 text-center">
        <h5 class="mb-4">Seleccione el tipo de trámite</h5>

        <div class="d-flex justify-content-center gap-3">
          <button class="btn btn-primary px-4" onclick="startProcedure('vif')">
            Denuncia Violencia Intrafamiliar
          </button>
          <button class="btn btn-primary px-4" onclick="startProcedure('mp')">
            Medida de Protección
          </button>
        </div>
      </section>

      <!-- FORMULARIO -->
      <form id="form-uap" class="d-none">

        <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="loadTestData()">
          Cargar datos de prueba
        </button>

        <!-- ================= DATOS SOLICITANTE ================= -->
        <h5 class="mb-3">Datos del Denunciante / Solicitante</h5>
        <div class="row g-3 mb-4">

          <div class="col-md-4">
            <label class="form-label">RUN *</label>
            <div class="d-flex gap-2">
              <input type="text" class="form-control rut-field" id="applicant_rut" name="applicant_rut" required>
              <button type="button" class="btn btn-secondary btn-search-rut" data-rut-input="applicant_rut"
                data-name-input="applicant_name" title="Buscar en historial">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>

          <div class="col-md-8">
            <label class="form-label">Nombre completo *</label>
            <input type="text" class="form-control" id="applicant_name" name="applicant_name" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Actividad</label>
            <input type="text" class="form-control" name="applicant_activity">
          </div>

          <div class="col-md-6">
            <label class="form-label">Domicilio *</label>
            <input type="text" class="form-control" name="applicant_address" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" name="applicant_phone">
          </div>

          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" name="applicant_email">
          </div>
        </div>

        <!-- ================= DATOS VÍCTIMA ================= -->
        <h5 class="mb-3">Datos de la Víctima / NNA</h5>
        <div class="row g-3 mb-4">

          <div class="col-md-4">
            <label class="form-label">RUN *</label>
            <div class="d-flex gap-2">
              <input type="text" class="form-control rut-field" id="victim_rut" name="victim_rut" required>
              <button type="button" class="btn btn-secondary btn-search-rut" data-rut-input="victim_rut"
                data-name-input="victim_name">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>

          <div class="col-md-8">
            <label class="form-label">Nombre completo *</label>
            <input type="text" class="form-control" id="victim_name" name="victim_name" required>
          </div>

          <div class="col-md-4">
            <label class="form-label">Edad</label>
            <input type="number" class="form-control" name="victim_age">
          </div>

          <div class="col-md-8">
            <label class="form-label">Escolaridad</label>
            <input type="text" class="form-control" name="victim_schooling">
          </div>

          <div class="col-md-12">
            <label class="form-label">Domicilio *</label>
            <input type="text" class="form-control" name="victim_address" required>
          </div>
        </div>

        <!-- ================= DATOS DENUNCIADO ================= -->
        <h5 class="mb-3">Datos del Denunciado / Solicitado</h5>
        <div class="row g-3 mb-4">

          <div class="col-md-4">
            <label class="form-label">RUN *</label>
            <div class="d-flex gap-2">
              <input type="text" class="form-control rut-field" id="accused_rut" name="accused_rut" required>
              <button type="button" class="btn btn-secondary btn-search-rut" data-rut-input="accused_rut"
                data-name-input="accused_name">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>

          <div class="col-md-8">
            <label class="form-label">Nombre completo *</label>
            <input type="text" class="form-control" id="accused_name" name="accused_name" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Actividad</label>
            <input type="text" class="form-control" name="accused_activity">
          </div>

          <div class="col-md-6">
            <label class="form-label">Vínculo / parentesco</label>
            <input type="text" class="form-control" name="relationship">
          </div>

          <div class="col-md-12">
            <label class="form-label">Domicilio *</label>
            <input type="text" class="form-control" name="accused_address" required>
          </div>
        </div>

        <!-- ACCIÓN FINAL -->
        <div class="text-end mb-4">
          <button type="button" class="btn btn-primary px-4" onclick="saveRecord().then(id => generatePdfAndStore(id))">
            Guardar registro y generar PDF
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- ================= MODAL PDF ================= -->
  <div class="modal fade" id="pdfModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Documento generado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-0">
          <iframe id="pdf-preview" style="width:100%; height:80vh; border:none;"></iframe>
        </div>

        <div class="modal-footer">
          <button class="btn btn-primary" onclick="window.print()">
            Imprimir
          </button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">
            Cerrar
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Supabase config -->
  <script>
    window.SUPABASE_URL = "https://gajatzawdjbobvpkuwej.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_QZLp6C9qJgERaIIK8i92qw_2Cm8htUz";
  </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../../assets/js/vendors/pdfmake.min.js"></script>
  <script src="../../assets/js/vendors/vfs_fonts.js"></script>

  <script src="../../assets/js/uap/pjud-logo.js"></script>
  <script src="../../assets/js/uap/uap-form.js"></script>


</body>

</html>
