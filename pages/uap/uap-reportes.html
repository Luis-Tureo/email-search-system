<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Reportes UAP</title>
  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>

  <div class="container-fluid">

    <!-- HEADER -->
    <div class="header-bar">
      <div>
        <h1 class="title-main">Reportes UAP</h1>
        <div class="subtitle-main">Estadísticas por fecha y tipo</div>
      </div>
      <button class="btn btn-logout">Cerrar sesión</button>
    </div>

    <!-- FILTROS -->
    <div class="row g-3 mb-3">

      <div class="col-md-3">
        <label class="form-label">Fecha inicio</label>
        <input type="date" id="startDate" class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">Fecha término</label>
        <input type="date" id="endDate" class="form-control">
      </div>

      <div class="col-md-3 align-self-end">
        <button class="btn btn-primary" id="btnGenerate">
          Generar reporte
        </button>
      </div>

    </div>

    <!-- RESUMEN -->
    <div class="row g-3 mb-3">

      <div class="col-md-4">
        <div class="alert alert-info">
          <strong>Total registros:</strong>
          <span id="totalCount">0</span>
        </div>
      </div>

      <div class="col-md-4">
        <div class="alert alert-secondary">
          <strong>VIF:</strong> <span id="countVif">0</span><br>
          <strong>Medida Protección:</strong> <span id="countMp">0</span>
        </div>
      </div>

      <div class="col-md-4">
        <div class="alert alert-warning">
          <strong>Confirmados:</strong> <span id="countConfirmed">0</span><br>
          <strong>Revisados:</strong> <span id="countReviewed">0</span>
        </div>
      </div>

    </div>

    <!-- TABLA DETALLE -->
    <div class="table-container">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>RUN</th>
            <th>Nombre</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="reportTable"></tbody>
      </table>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Supabase config -->
  <script>
    window.SUPABASE_URL = "https://gajatzawdjbobvpkuwej.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_QZLp6C9qJgERaIIK8i92qw_2Cm8htUz";
  </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../../assets/js/core/app.js"></script>
  <script src="../../assets/js/uap/uap-reportes.js"></script>
</body>

</html>
