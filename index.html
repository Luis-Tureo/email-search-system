<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Sistema de Correos Institucionales</title>

    <!-- RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 🔵 BOOTSTRAP ONLINE (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container-fluid">

        <!-- Encabezado -->
        <div class="header-bar">

            <div class="d-flex align-items-center">
                <img src="https://www.pjud.cl/img/pjud_blanco.png"
                     class="logo-pjud"
                     alt="Poder Judicial de Chile">

                <div class="ms-3">
                    <div class="title-main">
                        Sistema de Búsqueda de Correos Institucionales
                    </div>
                    <div class="subtitle-main">
                        Tribunal de Familia de Ancud – Poder Judicial de Chile
                    </div>
                </div>
            </div>

            <!-- Cerrar sesión -->
            <button class="btn btn-danger mt-3" onclick="closeSystem()">
                Cerrar sistema
            </button>
        </div>

        <!-- Barra de búsqueda -->
        <div class="row mb-3 g-2">

            <div class="col-md-1">
                <input type="text"
                       id="buscar-id"
                       class="form-control text-center"
                       placeholder="ID"
                       maxlength="4"
                       inputmode="numeric"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div class="col-md-4">
                <input type="text"
                       id="buscar"
                       class="form-control"
                       placeholder="Buscar institución, observación o correo">
            </div>

            <div class="col-md-1">
                <select id="zona" class="form-select" disabled>
                    <option value="">Zona</option>
                </select>
            </div>

            <div class="col-md-1">
                <select id="region" class="form-select" disabled>
                    <option value="">Región</option>
                </select>
            </div>

            <div class="col-md-1">
                <select id="comuna" class="form-select" disabled>
                    <option value="">Comuna</option>
                </select>
            </div>
        </div>

        <!-- Mensajes -->
        <div id="mensajes"></div>

        <!-- Resultados -->
        <div class="results-table table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Institución</th>
                        <th>Correo</th>
                        <th>Región</th>
                        <th>Comuna</th>
                        <th>Observación</th>
                        <th>Documento</th>
                        <th class="col-accion">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-body"></tbody>
            </table>
        </div>

        <!-- Contador -->
        <div class="mt-2">
            <span id="counter">Registros encontrados: 0</span>
        </div>

    </div>

    <!-- 🔵 BOOTSTRAP ONLINE (JS + Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- Lógica de la aplicación -->
    <script src="assets/js/app.js"></script>

</body>
</html>
