<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Sistema de Correos Institucionales</title>

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="hidden-scroll">

    <!-- ================= LOGIN ================= -->
    <div id="login-screen" class="d-flex vh-100 justify-content-center align-items-center">

        <div class="card shadow p-4" style="width:350px;">

            <div class="text-center mb-3">
                <img src="/assets/img/pjud-logo.png" alt="Poder Judicial de Chile">
            </div>

            <input type="password" id="login-password" class="form-control mb-3" placeholder="Ingrese contraseña"
                autocomplete="current-password">

            <button id="btn-login" class="btn btn-primary w-100">
                Ingresar
            </button>

            <div id="login-error" class="text-danger text-center mt-2 d-none">
                Contraseña incorrecta
            </div>

        </div>
    </div>

    <!-- ================= APP CONTENT ================= -->
    <div id="app-content" class="d-none">
        <div class="container-fluid">

            <!-- Encabezado -->
            <div class="header-bar d-flex justify-content-between align-items-center flex-wrap">

                <div class="d-flex align-items-center">
                    <img src="/assets/img/pjud_blanco.png" class="logo-pjud" alt="Poder Judicial de Chile">

                    <div class="ms-3">
                        <div class="title-main">
                            Sistema de Búsqueda de Correos Institucionales
                        </div>
                        <div class="subtitle-main">
                            Tribunal de Familia de Ancud
                        </div>
                    </div>
                </div>

                <!-- Cerrar sesión -->
                <button id="logout-link" class="btn btn-logout">
                    Cerrar sesión
                </button>

            </div>

            <!-- Toast -->
            <div id="toast-copiar" class="toast-copiar">
                Correo copiado al portapapeles
            </div>

            <!-- Barra de búsqueda -->
            <div class="row mb-3 g-2">

                <div class="col-md-1">
                    <input type="text" id="search-id" class="form-control text-center" placeholder="ID" maxlength="4"
                        inputmode="numeric">
                </div>

                <div class="col-md-4">
                    <input type="text" id="search-text" class="form-control"
                        placeholder="Buscar institución, observación o correo">
                </div>

                <div class="col-md-1">
                    <select id="zone-filter" class="form-select" disabled>
                        <option value="">Zona</option>
                    </select>
                </div>

                <div class="col-md-1">
                    <select id="region-filter" class="form-select" disabled>
                        <option value="">Región</option>
                    </select>
                </div>

                <div class="col-md-1">
                    <select id="comuna-filter" class="form-select" disabled>
                        <option value="">Comuna</option>
                    </select>
                </div>
            </div>

            <!-- Tabla -->
            <div class="table-container">
                <table class="table table-striped table-hover table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Institución</th>
                            <th>Correo</th>
                            <th>Región</th>
                            <th>Comuna</th>
                            <th>Observación</th>
                            <th>Documento</th>
                            <th class="col-center">Copiar</th>
                            <th class="col-center col-edit">Editar</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>

            <div class="mt-2">
                <span id="results-counter">Registros encontrados: 0</span>
            </div>

        </div>
    </div>

    <!-- ================= MODAL EDITAR ================= -->
    <div class="modal fade" id="editInstitutionModal" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Editar Institución</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="edit-id">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Institución</label>
                            <input type="text" id="edit-institution-name" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Correo</label>
                            <input type="text" id="edit-email" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Región</label>
                            <select id="edit-region" class="form-select"></select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Comuna</label>
                            <select id="edit-comuna" class="form-select"></select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Observación</label>
                            <textarea id="edit-observation" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="col-12">
                            <hr>
                            <h6>Documentos PDF</h6>
                            <div id="edit-files-list" class="mb-2"></div>
                            <input type="file" id="edit-new-file" class="form-control" accept="application/pdf">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-primary" id="btn-save-institution">
                        Guardar cambios
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase config -->
    <script>
        window.SUPABASE_URL = "https://gajatzawdjbobvpkuwej.supabase.co";
        window.SUPABASE_ANON_KEY = "sb_publishable_QZLp6C9qJgERaIIK8i92qw_2Cm8htUz";
    </script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App -->
    <script src="/assets/js/core/app.js"></script>

</body>

</html>
