<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Historial UAP</title>
    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../../assets/css/uap.css">
</head>

<body>

    <div class="container-fluid">

        <!-- HEADER -->
        <div class="header-bar">
            <div>
                <h1 class="title-main">Historial UAP</h1>
                <div class="subtitle-main">Registros ingresados</div>
            </div>
            <button class="btn btn-logout">Cerrar sesión</button>
        </div>

        <!-- FILTROS -->
        <div class="row g-3 mb-3">

            <div class="col-md-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por RUN o nombre">
            </div>

            <div class="col-md-2">
                <select id="typeFilter" class="form-select">
                    <option value="">Todos</option>
                    <option value="vif">VIF</option>
                    <option value="mp">Medida Protección</option>
                </select>
            </div>

            <div class="col-md-2">
                <select id="statusFilter" class="form-select">
                    <option value="">Todos</option>
                    <option value="confirmado">Confirmado</option>
                    <option value="revisado">Revisado</option>
                </select>
            </div>

            <div class="col-md-2">
                <button class="btn btn-secondary" id="btn-clear-filters">
                    Limpiar filtros
                </button>
            </div>

        </div>

        <!-- TABLA -->
        <div class="table-container">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>RUN</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>PDF</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="historyTable"></tbody>
            </table>
        </div>

        <div id="counter"></div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase config -->
    <script>
        window.SUPABASE_URL = "https://gajatzawdjbobvpkuwej.supabase.co";
        window.SUPABASE_ANON_KEY = "sb_publishable_QZLp6C9qJgERaIIK8i92qw_2Cm8htUz";
    </script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/uap/uap-historial.js"></script>

</body>

</html>
