<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Directorio PJUD Ancud</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Estilos PJUD -->
    <link rel="stylesheet" href="/assets/css/uap.css">
</head>

<body class="uap-mobile">

    <div class="uap-mobile-shell">

        <!-- HEADER -->
        <div class="uap-mobile-header">
            <div>
                <div class="uap-mobile-title">Directorio Institucional</div>
                <div class="uap-mobile-subtitle">
                    Instituciones de apoyo Ancud / Castro
                </div>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="uap-mobile-card">
            <div class="uap-h5">Buscar contacto</div>

            <input id="searchInput" type="text" class="form-control mb-2"
                placeholder="Buscar por institución, dirección o correo">

            <select id="cityFilter" class="form-select mb-2">
                <option value="">Todas las comunas</option>
                <option value="Ancud">Ancud</option>
                <option value="Castro">Castro</option>
            </select>

            <select id="typeFilter" class="form-select">
                <option value="">Todos los tipos</option>
                <option value="Justicia">Justicia</option>
                <option value="Salud">Salud</option>
                <option value="Protección">Protección</option>
                <option value="Municipal">Municipal</option>
                <option value="SERNAMEG">SERNAMEG</option>
            </select>
        </div>

        <!-- RESULTADOS -->
        <div id="cardsContainer"></div>

        <div class="uap-mobile-card text-center">
            <span id="resultsCounter">Registros encontrados: 0</span>
        </div>

    </div>

    <!-- TOAST -->
    <div id="toast-copiar" class="toast-copiar"></div>

    <!-- JS EXTERNO -->
    <script src="/assets/js/uap/uap-directory.js"></script>

</body>

</html>
